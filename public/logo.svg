<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1524"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>

    <!-- Medical Cyan/Teal Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#00c2cb"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Crisp White/Platinum Gradient for S letter & Cross structure -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Cross Silhouette Gradient -->
    <linearGradient id="crossBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142138"/>
      <stop offset="100%" stop-color="#0b1424"/>
    </linearGradient>

    <!-- Neon Teal Glow Filter -->
    <filter id="glowTeal" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Depth Drop Shadow -->
    <filter id="shadowDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Ambient Cyan Halo -->
    <filter id="cyanHalo" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#00c2cb" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Clean Dark Canvas Container -->
  <rect width="600" height="600" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Rim Stroke -->
  <rect x="10" y="10" width="580" height="580" rx="110" fill="none" stroke="#1b2a44" stroke-width="3"/>
  <rect x="18" y="18" width="564" height="564" rx="102" fill="none" stroke="#00c2cb" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- ==================== THE EMBEDDED MEDICAL CROSS & MONOGRAM (S + M) ==================== -->
  <g transform="translate(140, 100)" filter="url(#cyanHalo)">
    
    <!-- 1. Deep Navy Cross Structural Base with Subtle Glow -->
    <g filter="url(#shadowDepth)">
      <path d="M 108 20 C 108 9 117 0 128 0 L 192 0 C 203 0 212 9 212 20 L 212 108 L 300 108 C 311 108 320 117 320 128 L 320 192 C 320 203 311 212 300 212 L 212 212 L 212 300 C 212 311 203 320 192 320 L 128 320 C 117 320 108 311 108 300 L 108 212 L 20 212 C 9 212 0 203 0 192 L 0 128 C 0 117 9 108 20 108 L 108 108 Z" 
            fill="url(#crossBaseGrad)" 
            stroke="#223656" 
            stroke-width="3"/>
    </g>

    <!-- Inner Contour Stroke of Cross -->
    <path d="M 112 24 C 112 18 118 12 126 12 L 194 12 C 202 12 208 18 208 24 L 208 112 L 296 112 C 302 112 308 118 308 124 L 308 196 C 308 202 302 208 296 208 L 208 208 L 208 296 C 208 302 202 308 194 308 L 126 308 C 118 308 112 302 112 296 L 112 208 L 24 208 C 18 208 12 202 12 196 L 12 124 C 12 118 18 112 24 112 L 112 112 Z" 
          fill="none" 
          stroke="#00c2cb" 
          stroke-opacity="0.22" 
          stroke-width="2"/>

    <!-- 2. LETTER "S" (Crafted in Clean Pure White Clinical Geometry) -->
    <path d="M 190 62 
             C 145 62, 70 75, 70 125 
             C 70 165, 125 175, 160 185 
             C 215 200, 245 220, 245 260 
             C 245 295, 205 305, 145 305 
             C 95 305, 60 285, 45 260" 
          fill="none" 
          stroke="url(#whiteGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#shadowDepth)"/>

    <!-- 3. LETTER "M" (Crafted in Vibrant Cyan/Teal ECG Heartbeat Pulse Lines) -->
    <path d="M 125 295 
             L 125 110 
             L 185 210 
             L 245 110 
             L 245 295" 
          fill="none" 
          stroke="url(#tealGrad)" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glowTeal)"/>

    <!-- 4. Pulse Nodes -->
    <circle cx="185" cy="210" r="9" fill="#ffffff" filter="url(#glowTeal)"/>
    <circle cx="125" cy="110" r="7" fill="#00f2fe"/>
    <circle cx="245" cy="110" r="7" fill="#00f2fe"/>

    <!-- Dynamic Heartbeat Pulse Horizontal Wave passing through -->
    <path d="M -10 160 L 60 160 L 80 130 L 105 195 L 125 145 L 140 160 L 330 160" 
          fill="none" 
          stroke="#00f2fe" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-opacity="0.85"
          filter="url(#glowTeal)"/>
  </g>

  <!-- ==================== BRAND WORDMARK LOCKUP ==================== -->
  <g transform="translate(300, 485)" text-anchor="middle">
    <!-- Brand Name -->
    <text font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      <tspan fill="#ffffff">Soli </tspan>
      <tspan fill="url(#tealGrad)">Medical</tspan>
    </text>

    <!-- Micro Descriptor -->
    <text y="42" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#64748b" letter-spacing="4">
      SM CLINIC SYSTEMS
    </text>
  </g>
</svg>
