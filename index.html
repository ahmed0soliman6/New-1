    <script>
      // Fix: prevent "Cannot set property fetch of #<Window> which has only a getter"
      (function () {
        try {
          var currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return typeof currentFetch === 'function' ? currentFetch.bind(window) : currentFetch;
            },
            set: function (newFetch) {
              currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (err) {
          console.warn('Polyfill for window.fetch setter failed:', err);
        }
      })();
    </script>

    <script>
      // Prevent stale Service Worker caching issues that cause white screen of death
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var registration of registrations) {
            registration.unregister().then(function(success) {
              if (success) console.log('Soli PWA ServiceWorker unregistered successfully to prevent stale assets caching.');
            });
          }
        }).catch(function(err) {
          console.warn('Error unregistering service workers:', err);
        });
      }

      // Force purge cache storage to avoid loading outdated hashed Vite bundles
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          keys.forEach(function(key) {
            caches.delete(key).then(function() {
              console.log('Cleared stale Cache Storage:', key);
            });
          });
        }).catch(function(err) {
          console.warn('Error clearing caches:', err);
        });
      }
    </script>
