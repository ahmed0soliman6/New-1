name: Deploy Soli Medical to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyAHxGowquPtUriRqSnMOIQofv9h4DqK-NQ
          VITE_FIREBASE_AUTH_DOMAIN: solimedical-new.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: solimedical-new
          VITE_FIREBASE_STORAGE_BUCKET: solimedical-new.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: 907861387011
          VITE_FIREBASE_APP_ID: 1:907861387011:web:e5788fdd9fff73cad02b36
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
